name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app src tests

      - name: dbt build (models + data tests)
        run: mkdir -p warehouse && cd dbt && dbt build --profiles-dir .

      - name: Unit tests
        run: python -m pytest -q

      - name: App smoke test
        run: |
          timeout 60 streamlit run app/streamlit_app.py --server.headless true --server.port 8501 &
          sleep 20
          curl -sf http://localhost:8501/_stcore/health

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sp500-risk-analytics .

[project]
name = "riskkit"
version = "0.1.0"
description = "Return, risk and valuation helpers for the S&P 500 analysis"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "statsmodels"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]
